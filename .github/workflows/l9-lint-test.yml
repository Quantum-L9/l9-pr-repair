# L9 Consumer Lint + Test — Python Preset (LOCKED STRUCTURE)
#
# DO NOT EDIT workflow structure — only the env: block is consumer-configurable.
# Managed by l9-ci-core presets/python.
#
# Conventions:
#   - Immutable event-revision checkout (no floating action ref)
#   - SHA-pinned external actions
#   - Least privilege (contents: read only)
name: L9 Lint and Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# ── CONFIGURABLE: agent sets these during activation ───────────────────────────
env:
  PYTHON_VERSION: "3.12"
  SOURCE_DIR: "src/"
  TEST_DIR: "tests/"
  COVERAGE_THRESHOLD: "0"
  PYTEST_PARALLEL: "false"
  MYPY_EXCLUDE: ""

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv.lock is this repository's resolved dependency set. `--locked`
      # installs exactly what it records and fails the job when the lockfile has
      # drifted from pyproject.toml; `--no-build` refuses source distributions,
      # so no dependency's setup.py executes during installation. The unpinned
      # `pip install ruff` / `pip install mypy` this replaces resolved to
      # whatever was latest on each run.
      #
      # mypy still sees real types rather than Any: the runtime dependencies are
      # installed and pydantic ships PEP 561 types.
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: "uv==0.12.10"
          uv sync --locked --no-build

      - name: ruff check
        # uv run --no-sync: the tools live in the .venv built by the install
        # step, and re-syncing here would undo that step's --no-build guarantee.
        run: uv run --no-sync --no-build ruff check "${SOURCE_DIR}" --output-format=github

      - name: ruff format --check
        run: uv run --no-sync --no-build ruff format --check "${SOURCE_DIR}"

      - name: mypy
        run: |
          set -euo pipefail
          # mkdir required before --install-types on a cold cache, else mypy
          # fails with the misleading "no mypy cache directory" error and
          # masks any real type errors underneath it (python/mypy#10768).
          mkdir -p .mypy_cache
          MYPY_EXCLUDE_ARGS=()
          if [ -n "${MYPY_EXCLUDE}" ]; then
            MYPY_EXCLUDE_ARGS=(--exclude "${MYPY_EXCLUDE}")
          fi
          uv run --no-sync --no-build mypy "${SOURCE_DIR}" \
            "${MYPY_EXCLUDE_ARGS[@]}" \
            --show-error-codes --pretty \
            --install-types --non-interactive --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Same locked, no-source-build install as the lint job. The chain of
      # conditional `pip install` fallbacks this replaces pulled pytest-xdist
      # and pytest-timeout that pyproject.toml declared nowhere, so uv.lock did
      # not carry them; they are declared now.
      - name: Install test tools
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: "uv==0.12.10"
          uv sync --locked --no-build

      - name: pytest with coverage
        env:
          TESTING: "true"
        run: |
          set -euo pipefail
          XDIST_ARGS=()
          if [ "${PYTEST_PARALLEL}" = "true" ]; then
            XDIST_ARGS=(-n auto)
          fi
          PYTHONPATH=. uv run --no-sync --no-build pytest "${TEST_DIR}" \
            "${XDIST_ARGS[@]}" \
            --cov="${SOURCE_DIR}" \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --timeout=300 --tb=short -v
