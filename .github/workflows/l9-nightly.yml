---
# Quantum-L9 org starter — org nightly (ci_deep analyze-semgrep + full-tree tests).
# Thin trigger only. Calls the l9-ci-core nightly kernel; do not add scan logic here.
name: "L9 Nightly"
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l9_nightly:
    uses: Quantum-L9/l9-ci-core/.github/workflows/nightly.yml@0d3d8d3cf2828e1a8c01c237597feb3979c2ba52
    permissions:
      actions: read
      checks: write
      contents: read
    # No `secrets: inherit`. The nightly kernel declares no workflow_call
    # secrets and uses only secrets.GITHUB_TOKEN, which GitHub provisions for
    # reusable workflows automatically; the analyze-semgrep workflow it calls
    # declares and uses none either. Inheriting handed the full repository
    # secret set to a workflow that needs no secret at all.
    with:
      python-version: "3.12"
      run-extended-tests: true
      language: python
